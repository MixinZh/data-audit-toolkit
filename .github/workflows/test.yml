name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  base:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip build twine
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: data-audit benchmark
      - run: python -m build
      - run: python -m twine check dist/*
      - if: matrix.python-version == '3.14'
        run: python -m pip install "git+https://github.com/agentskills/agentskills.git@38a2ff82958afee88dadf4831509e6f7e9d8ef4e#subdirectory=skills-ref"
      - if: matrix.python-version == '3.14'
        run: skills-ref validate "$GITHUB_WORKSPACE"

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[images]"
      - run: python -m unittest discover -s tests -v
      - run: data-audit benchmark
